[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "regdiffusion"
authors = [
    { name = "Hao Zhu", email="haozhu233@gmail.com"},
    { name = "Donna Slonim", email="donna.slonim@tufts.edu"}
]
maintainers = [
    { name = "Hao Zhu", email = "haozhu233@gmail.com" }
]
readme = "README.md"
license = {file = "LICENSE"}
version = "0.2.3"
description = "Gene regulatory network inference from single-cell RNA-seq using diffusion models"
keywords = ["gene regulatory network", "GRN inference", "single-cell RNA-seq", "diffusion model", "bioinformatics"]

classifiers = ["License :: OSI Approved :: Apache Software License"]

dependencies = [
    "numpy>=1.16.5",
    "pandas>=1.1.1",
    "torch",
    "tqdm",
    "scanpy",
    "scikit-learn",
    "h5py",
    "lightgraph>=1.2.0"
]

[project.urls]
Home = "https://github.com/TuftsBCB/RegDiffusion"
Documentation = "https://tuftsbcb.github.io/RegDiffusion/"
Source = "https://github.com/TuftsBCB/RegDiffusion"
Issues = "https://github.com/TuftsBCB/RegDiffusion/issues"
Publication = "https://doi.org/10.1089/cmb.2024.0607"

[project.scripts]
regdiffusion = "regdiffusion.cli:main"

[tool.flit.module]
name = "regdiffusion"
