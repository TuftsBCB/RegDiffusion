name: Build and Deploy Sphinx Documentation

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install sphinx sphinx_book_theme myst-parser sphinx-copybutton --upgrade
        # Install the CPU build of torch first so the package install below
        # does not pull the much larger CUDA wheels.
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # Install regdiffusion itself so autodoc can import it and so runtime
        # dependencies stay in sync with pyproject.toml.
        pip install .

    - name: Build documentation
      run: |
        cd docs
        make html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/_build/html
